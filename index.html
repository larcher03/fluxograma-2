<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criador de Fluxogramas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Criador de Fluxogramas</h1>
    <div class="toolbar">
      <button id="add-start">Início/Fim</button>
      <button id="add-process">Processo</button>
      <button id="add-decision">Decisão</button>
      <button id="clear-canvas">Limpar</button>
    </div>
  </header>

  <main>
    <div id="canvas" class="canvas">
      <!-- Blocos do fluxograma serão inseridos aqui -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
